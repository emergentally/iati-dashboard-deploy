{% set domainnames = " ".join([servername] + serveraliases) %}

# Nuxt sets its own cache headers on hashed assets; HTML must not be cached.
map $sent_http_content_type $expires {
    "text/html"                 epoch;
    "text/html; charset=utf-8"  epoch;
    default                     off;
}

server {
    server_name {{ domainnames }};

    # The stock gzip_types is text/html only, so JSON and JS go out
    # uncompressed unless listed here.
    gzip             on;
    gzip_types       text/plain text/css application/xml application/javascript application/json image/svg+xml;
    gzip_vary        on;
    gzip_comp_level  5;
    gzip_min_length  1000;

    error_log  /var/www/logs/{{ name }}_error.log;
    access_log /var/www/logs/{{ name }}_access.log timed;

    # Maintenance mode: `touch /var/www/maintenance/{{ name }}.on` returns 503
    # until the file is removed - no rebuild, no nginx reload. The exemptions
    # matter: acme-challenge so certificates still renew, 127.0.0.1 so a deploy
    # can be verified before the flag is lifted, and maintenance.html itself,
    # which would otherwise re-enter this check and loop into a 500.
    set $maintenance 0;
    if (-f /var/www/maintenance/{{ name }}.on) { set $maintenance 1; }
    if ($uri ~ ^/\.well-known/acme-challenge/) { set $maintenance 0; }
    if ($uri = /maintenance.html) { set $maintenance 0; }
    if ($remote_addr = 127.0.0.1) { set $maintenance 0; }
    if ($maintenance = 1) { return 503; }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/maintenance;
        add_header Retry-After 300 always;
        internal;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Automated scanners probe these constantly. Without this they reach the
    # Nuxt catch-all route, which renders a full page per request before
    # returning 404 - orders of magnitude more expensive than the 404 itself.
    location ~ ^/(info|containers/json|images/json|version|_ping|actuator|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|\.env|\.git/|vendor/|solr/|cgi-bin/)(/|$) {
        return 404 "Not Found\n";
        default_type text/plain;
    }

    # Nuxt i18n message bundles are content-hashed in the path, so they can be
    # cached indefinitely. Without this they are refetched on every navigation.
    location /_i18n/ {
        proxy_pass http://localhost:{{ pm2_port }};
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        expires $expires;
        proxy_redirect                     off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 10m;
        proxy_connect_timeout              1m;
        proxy_pass                         http://localhost:{{ pm2_port }};
    }

{% if https in ('yes', 'force', 'certonly') %}
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/{{ servername }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ servername }}/privkey.pem;
{% else %}
    listen 80;
{% endif %}

{% for alias in serveraliases %}
    if ($host = {{ alias }}) {
        return 301 https://{{ servername }}$request_uri;
    }
{% endfor %}
}

{% if https == 'force' %}
# Redirect http to https.
server {
    listen 80;
    server_name {{ domainnames }};

    # Certificate renewal must still work over plain http.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://{{ servername }}$request_uri;
    }
}
{% endif %}
